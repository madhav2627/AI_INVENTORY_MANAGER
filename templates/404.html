<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found &middot; AI INVENTORY MANAGER</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  :root, html, body {
    color-scheme: light !important;
    background-color: #f8fafc !important;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #0f172a;
    padding: 24px;
    box-sizing: border-box;
    background: radial-gradient(circle at 15% 15%, rgba(191, 155, 98, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                #f8fafc;
  }
  .error-card {
    max-width: 480px;
    width: 100%;
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(0, 0, 0, 0.04);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .error-code {
    font-size: 3.5rem;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.04em;
    color: #cbd5e1;
    line-height: 1;
  }
  .error-title {
    font-size: 1.45rem;
    font-weight: 700;
    margin: 12px 0;
    color: #1e293b;
  }
  .error-desc {
    font-size: 0.95rem;
    color: #64748b;
    line-height: 1.5;
    margin: 0 0 24px 0;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    background: #0f172a;
    color: #ffffff;
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: #334155;
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The requested page or resource could not be found.</p>
    <a href="/" class="btn">Return to Dashboard</a>
  </div>
</body>
</html>
