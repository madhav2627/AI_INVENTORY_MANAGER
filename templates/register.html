<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register &middot; AI INVENTORY MANAGER</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  :root {
    --auth-bg-1: #ffffff;
    --auth-bg-2: #f8fafc;
    --auth-card-bg: rgba(255, 255, 255, 0.92);
    --auth-text-main: #0f172a;
    --auth-text-muted: #64748b;
    --auth-primary-start: #2563eb;
    --auth-primary-end: #1d4ed8;
    --auth-accent: #3b82f6;
  }

  body.auth-body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--auth-text-main);
    position: relative;
    overflow-x: hidden;
  }

  /* Animated background graphics */
  .bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    background: 
      radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(191, 155, 98, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(241, 245, 249, 0.5) 0%, #ffffff 100%);
  }

  .floating-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.6;
    animation: floatOrb 18s ease-in-out infinite alternate;
  }
  .orb-1 {
    width: 340px;
    height: 340px;
    background: rgba(37, 99, 235, 0.12);
    top: -60px;
    right: -60px;
  }
  .orb-2 {
    width: 400px;
    height: 400px;
    background: rgba(191, 155, 98, 0.12);
    bottom: -80px;
    left: -80px;
    animation-delay: -9s;
  }
  .orb-3 {
    width: 260px;
    height: 260px;
    background: rgba(99, 102, 241, 0.08);
    top: 35%;
    left: 15%;
    animation-delay: -4s;
  }

  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, 40px) scale(1.08); }
    100% { transform: translate(-20px, 20px) scale(0.95); }
  }

  .grid-pattern {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(15, 23, 42, 0.05) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.6;
  }

  /* Card wrapper with entrance animation */
  .auth-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    padding: 1.5rem;
    box-sizing: border-box;
    animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(24px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .auth-card {
    background: var(--auth-card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(226, 232, 240, 0.9);
    border-radius: 24px;
    padding: 2.5rem 2.25rem;
    box-shadow: 
      0 20px 40px -15px rgba(15, 23, 42, 0.07),
      0 0 0 1px rgba(255, 255, 255, 0.8) inset,
      0 10px 20px -5px rgba(37, 99, 235, 0.04);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .auth-card:hover {
    box-shadow: 
      0 25px 50px -12px rgba(15, 23, 42, 0.1),
      0 0 0 1px rgba(255, 255, 255, 0.9) inset,
      0 12px 24px -6px rgba(37, 99, 235, 0.08);
  }

  /* Brand Header */
  .auth-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    border-radius: 18px;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #1e40af 100%);
    color: #ffffff;
    margin-bottom: 1rem;
    box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.35);
    position: relative;
    animation: pulseBadge 3s ease-in-out infinite;
  }

  @keyframes pulseBadge {
    0%, 100% { transform: scale(1); box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.35); }
    50% { transform: scale(1.04); box-shadow: 0 14px 28px -4px rgba(37, 99, 235, 0.45); }
  }

  .auth-title {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #0f172a;
    margin: 0 0 0.35rem 0;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .auth-subtitle {
    font-size: 0.875rem;
    color: #64748b;
    margin: 0;
    font-weight: 500;
  }

  /* Flash alerts */
  .flash-stack {
    margin-bottom: 1.25rem;
  }
  .flash-alert {
    padding: 0.8rem 1rem;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fadeIn 0.3s ease-out;
  }
  .flash-danger {
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }
  .flash-success {
    background: #f0fdf4;
    color: #166534;
    border: 1px solid #bbf7d0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Form Elements */
  .form-group {
    margin-bottom: 1.15rem;
    position: relative;
  }

  .form-label {
    display: block;
    font-size: 0.825rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 0.45rem;
    letter-spacing: 0.01em;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon {
    position: absolute;
    left: 14px;
    color: #94a3b8;
    transition: color 0.2s ease;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .form-input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    font-size: 0.925rem;
    font-family: inherit;
    color: #0f172a;
    background: #ffffff;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    box-sizing: border-box;
    outline: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
  }

  .form-input::placeholder {
    color: #94a3b8;
  }

  .form-input:focus {
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12), 0 2px 4px rgba(0, 0, 0, 0.02);
  }

  .form-input:focus + .input-icon,
  .input-wrapper:focus-within .input-icon {
    color: #2563eb;
  }

  /* Submit Button */
  .btn-submit {
    width: 100%;
    padding: 0.85rem 1.5rem;
    margin-top: 0.75rem;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    color: #ffffff;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.35);
    position: relative;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-submit::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      60deg,
      transparent 30%,
      rgba(255, 255, 255, 0.25) 50%,
      transparent 70%
    );
    transform: rotate(30deg) translateY(-100%);
    transition: transform 0.8s ease;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.45);
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  }

  .btn-submit:hover::after {
    transform: rotate(30deg) translateY(100%);
  }

  .btn-submit:active {
    transform: translateY(0);
    box-shadow: 0 4px 8px -2px rgba(37, 99, 235, 0.3);
  }

  /* Auth Footer */
  .auth-footer {
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1.5px solid #f1f5f9;
    text-align: center;
    font-size: 0.875rem;
    color: #64748b;
  }

  .auth-link {
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .auth-link:hover {
    color: #1d4ed8;
    text-decoration: underline;
  }
</style>
</head>
<body class="auth-body">

<div class="bg-canvas">
  <div class="grid-pattern"></div>
  <div class="floating-orb orb-1"></div>
  <div class="floating-orb orb-2"></div>
  <div class="floating-orb orb-3"></div>
</div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="26" height="20" rx="3"/>
          <line x1="3" y1="12" x2="29" y2="12"/>
          <line x1="8" y1="18" x2="16" y2="18"/>
          <circle cx="23" cy="18" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <h1 class="auth-title">AI INVENTORY MANAGER</h1>
      <p class="auth-subtitle">Create a new manager account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash-alert flash-{{ category }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="full_name" class="form-label">Full Name</label>
        <div class="input-wrapper">
          <input type="text" id="full_name" name="full_name" class="form-input" placeholder="e.g. John Doe" required autofocus>
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" required autocomplete="username">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required autocomplete="new-password">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Confirm your password" required autocomplete="new-password">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </span>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Create Account</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? 
      <a href="{{ url_for('login') }}" class="auth-link">
        Sign In
      </a>
    </div>
  </div>
</div>

</body>
</html>
