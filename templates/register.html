<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    var saved = localStorage.getItem('ai-inventory-theme') || localStorage.getItem('ledger-theme');
    if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<title>Register &middot; AI INVENTORY MANAGER</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: var(--bg-surface, #f8fafc);
    font-family: inherit;
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    padding: 2.5rem;
    background: var(--bg-card, #ffffff);
    border: 1px solid var(--border-color, #e2e8f0);
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  }
  .auth-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .auth-header .brand-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    margin-bottom: 1rem;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  }
  .auth-header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    margin: 0 0 0.25rem 0;
    color: var(--text-main, #0f172a);
  }
  .auth-header p {
    font-size: 0.875rem;
    color: var(--text-muted, #64748b);
    margin: 0;
  }
  .form-group {
    margin-bottom: 1.25rem;
  }
  .form-group label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: var(--text-main, #334155);
  }
  .form-control {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    border-radius: 8px;
    border: 1px solid var(--border-color, #cbd5e1);
    background: var(--bg-input, #ffffff);
    color: var(--text-main, #0f172a);
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-control:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }
  .btn-submit {
    width: 100%;
    padding: 0.85rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn-submit:hover {
    opacity: 0.95;
  }
  .btn-submit:active {
    transform: scale(0.99);
  }
  .auth-footer {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.875rem;
    color: var(--text-muted, #64748b);
  }
  .auth-footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }
  .auth-footer a:hover {
    text-decoration: underline;
  }
  .flash-alert {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 1.25rem;
    font-size: 0.875rem;
    font-weight: 500;
  }
  .flash-danger {
    background: rgba(239, 68, 68, 0.1);
    color: #dc2626;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }
  .flash-success {
    background: rgba(34, 197, 94, 0.1);
    color: #16a34a;
    border: 1px solid rgba(34, 197, 94, 0.2);
  }
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <div class="brand-icon">
      <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
        <rect x="3" y="6" width="26" height="20" rx="2" stroke="currentColor" stroke-width="2.2"/>
        <line x1="3" y1="12" x2="29" y2="12" stroke="currentColor" stroke-width="2.2"/>
        <line x1="8" y1="18" x2="16" y2="18" stroke="currentColor" stroke-width="2.2"/>
      </svg>
    </div>
    <h1>AI INVENTORY MANAGER</h1>
    <p>Create a new account</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash-alert flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('register') }}">
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. John Doe" required autofocus>
    </div>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Choose a secure password" required autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your password" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn-submit">Create Account</button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
  </div>
</div>

</body>
</html>
